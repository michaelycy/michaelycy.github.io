<svg id="diagram-1" width="940" xmlns="http://www.w3.org/2000/svg" height="1030" viewBox="0 0 940 1030" role="graphics-document document" aria-roledescription="flowchart-v2">
<style>
#diagram-1{font-family:PingFang SC,Microsoft YaHei,sans-serif;font-size:15px;fill:#20344f;}
#diagram-1 .node rect,#diagram-1 .node path,#diagram-1 .node ellipse{fill:#edf3fc;stroke:#7797c3;stroke-width:1px;}
#diagram-1 .cluster rect{fill:#fff8e8;stroke:hsl(41.7,60%,85.5%);stroke-width:1px;}
#diagram-1 .cluster text{fill:#000717;}
#diagram-1 .edge{stroke:#73849b;fill:none;stroke-width:1px;}
#diagram-1 .edgeLabel rect{fill:#f4f7fa;opacity:0.85;stroke:none;}
#diagram-1 text{fill:#20344f;}
</style>
<defs>
<marker id="d1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#73849b"/></marker>
</defs>

