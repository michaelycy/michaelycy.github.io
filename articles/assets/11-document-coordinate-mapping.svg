<svg id="diagram-1" width="226" xmlns="http://www.w3.org/2000/svg" class="flowchart" height="465" viewBox="0 0 226 465" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#diagram-1{font-family:PingFang SC,Microsoft YaHei,sans-serif;font-size:15px;fill:#20344f;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-1 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-1 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-1 .error-icon{fill:#fff8e8;}#diagram-1 .error-text{fill:#000717;stroke:#000717;}#diagram-1 .edge-thickness-normal{stroke-width:1px;}#diagram-1 .edge-thickness-thick{stroke-width:3.5px;}#diagram-1 .edge-pattern-solid{stroke-dasharray:0;}#diagram-1 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-1 .edge-pattern-dashed{stroke-dasharray:3;}#diagram-1 .edge-pattern-dotted{stroke-dasharray:2;}#diagram-1 .marker{fill:#73849b;stroke:#73849b;}#diagram-1 .marker.cross{stroke:#73849b;}#diagram-1 svg{font-family:PingFang SC,Microsoft YaHei,sans-serif;font-size:15px;}#diagram-1 p{margin:0;}#diagram-1 .label{font-family:PingFang SC,Microsoft YaHei,sans-serif;color:#20344f;}#diagram-1 .cluster-label text{fill:#000717;}#diagram-1 .cluster-label span{color:#000717;}#diagram-1 .cluster-label span p{background-color:transparent;}#diagram-1 .label text,#diagram-1 span{fill:#20344f;color:#20344f;}#diagram-1 .node rect,#diagram-1 .node circle,#diagram-1 .node ellipse,#diagram-1 .node polygon,#diagram-1 .node path{fill:#edf3fc;stroke:#7797c3;stroke-width:1px;}#diagram-1 .rough-node .label text,#diagram-1 .node .label text,#diagram-1 .image-shape .label,#diagram-1 .icon-shape .label{text-anchor:middle;}#diagram-1 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram-1 .rough-node .label,#diagram-1 .node .label,#diagram-1 .image-shape .label,#diagram-1 .icon-shape .label{text-align:center;}#diagram-1 .node.clickable{cursor:pointer;}#diagram-1 .root .anchor path{fill:#73849b!important;stroke-width:0;stroke:#73849b;}#diagram-1 .arrowheadPath{fill:#0b0b0b;}#diagram-1 .edgePaths .path{stroke:#73849b;stroke-width:1px;}#diagram-1 .flowchart-link{stroke:#73849b;fill:none;}#diagram-1 .edgeLabel{background-color:#f4f7fa;text-align:center;}#diagram-1 .edgeLabel p{background-color:#f4f7fa;}#diagram-1 .edgeLabel rect{opacity:0.5;background-color:#f4f7fa;fill:#f4f7fa;}#diagram-1 .labelBkg{background-color:rgba(244, 247, 250, 0.5);}#diagram-1 .cluster rect{fill:#fff8e8;stroke:hsl(41.7391304348, 60%, 85.4901960784%);stroke-width:1px;}#diagram-1 .cluster text{fill:#000717;}#diagram-1 .cluster span{color:#000717;}#diagram-1 .node .collapsed-indicator{fill:hsl(41.7391304348, 60%, 85.4901960784%);stroke:none;opacity:0.6;}#diagram-1 .node .collapsed-separator{stroke:hsl(41.7391304348, 60%, 85.4901960784%);stroke-width:0.75px;}#diagram-1 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:PingFang SC,Microsoft YaHei,sans-serif;font-size:12px;background:#fff8e8;border:1px solid hsl(41.7391304348, 60%, 85.4901960784%);border-radius:2px;pointer-events:none;z-index:100;}#diagram-1 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#20344f;}#diagram-1 rect.text{fill:none;stroke-width:0;}#diagram-1 .icon-shape,#diagram-1 .image-shape{background-color:#f4f7fa;text-align:center;}#diagram-1 .icon-shape p,#diagram-1 .image-shape p{background-color:#f4f7fa;padding:2px;}#diagram-1 .icon-shape .label rect,#diagram-1 .image-shape .label rect{opacity:0.5;background-color:#f4f7fa;fill:#f4f7fa;}#diagram-1 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#diagram-1 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#diagram-1 .node .neo-node{stroke:#7797c3;}#diagram-1 [data-look="neo"]